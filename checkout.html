{% extends "base.html" %}
{% block title %}Place Order - Fresh Village Dairy{% endblock %}
{% block content %}
<div class="form-container">
    <h2>Place Your Dairy Order</h2>
    <form method="POST">
        <div class="form-group">
            <label>Your Name:</label>
            <input type="text" name="name" required placeholder="Enter your full name">
        </div>
        <div class="form-group">
            <label>Select Product:</label>
            <select name="product">
                <option value="Raw Cow Milk">Raw Cow Milk (₹60/L)</option>
                <option value="Pure Butter">Pure Butter (₹450/Kg)</option>
                <option value="Thick Curd">Thick Curd (₹80/Kg)</option>
            </select>
        </div>
        <div class="form-group">
            <label>Quantity (L / Kg):</label>
            <input type="number" name="quantity" min="1" value="1" required>
        </div>
        
        <!-- NEW PAYMENT MODE FIELD -->
        <div class="form-group">
            <label>Payment Mode:</label>
            <select name="payment_mode" required>
                <option value="Cash on Delivery (COD)">Cash on Delivery (COD)</option>
                <option value="UPI (Google Pay / PhonePe / Paytm)">UPI (Google Pay / PhonePe / Paytm)</option>
                <option value="Debit / Credit Card">Debit / Credit Card</option>
            </select>
        </div>

        <button type="submit" class="btn">Confirm Order</button>
    </form>
</div>
{% endblock %}
