<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-site-verification" content="E2CBsRne4KJpHnwSumYfwctV9_V1bMbNhDRydEizfiw" />
    <title>{% block title %}DR-Fresh Village Dairy{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="promo-bar">
        <span>⚡ 10-Minute Delivery to your doorstep • Free delivery on orders above ₹199!</span>
    </div>

    <nav class="navbar">
        <div class="nav-brand-wrap">
            <div class="brand-badge">DR</div>
            <div class="brand-name">DR-Fresh Village Dairy</div>
            <div class="mini-badge">10 mins</div>
            <div class="mini-badge mini-badge-light">Pune Central</div>
        </div>

        <div class="nav-search">
            <span class="search-icon">⌕</span>
            <input type="text" placeholder="Search milk, ghee, curd, paneer, sweets...">
        </div>

        <div class="nav-actions">
            <a href="{{ url_for('home') }}" class="nav-link">Store</a>
            <a href="{{ url_for('ratings_page') }}" class="nav-link">Reviews</a>
            <a href="{{ url_for('cart') }}" class="cart-pill">
                <span class="cart-icon">🛒</span>
                <span>0 Items</span>
                <span class="cart-price">₹0</span>
            </a>
        </div>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>&copy; 2026 DR-Fresh Village Dairy. Local, Pure, & Healthy.</p>
    </footer>
</body>
</html>
