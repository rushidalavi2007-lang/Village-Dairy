<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Fresh Village Dairy{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">🥛 Fresh Village Dairy</div>
        <div class="nav-links">
            <a href="{{ url_for('home') }}">Home</a>
            <a href="{{ url_for('cart') }}">Cart</a>
            <a href="{{ url_for('checkout') }}">Place Order</a>
            <a href="{{ url_for('ratings_page') }}">Ratings</a> <!-- NEW -->
            <a href="{{ url_for('cancel_order') }}">Cancel Order</a>
        </div>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>&copy; 2026 Fresh Village Dairy. Local, Pure, & Healthy.</p>
    </footer>
</body>
</html>
